name: ShelterSeek CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./backend

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './backend/package-lock.json'
        
    - run: npm install
    - run: npm test
      env:
        CI: true
        NODE_ENV: test
        JWT_SECRET: test_secret_key_123

  test-frontend:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./frontend

    steps:
    - uses: actions/checkout@v3
    - name: Use Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
        cache: 'npm'
        cache-dependency-path: './frontend/package-lock.json'
        
    - run: npm install
    - run: npm test
    - run: npm run build
      env:
        CI: false
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
      
    - name: Build Backend Image
      uses: docker/build-push-action@v4
      with:
        context: ./backend
        push: false # Set to true when registry credentials are configured
        tags: shelterseek-backend:latest
        
    - name: Build Frontend Image
      uses: docker/build-push-action@v4
      with:
        context: ./frontend
        push: false
        tags: shelterseek-frontend:latest

  deploy-production:
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend] # Skip docker-build for now if we're doing direct provider deploys
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
    - uses: actions/checkout@v3

    - name: Deploy Backend to Render
      run: |
        # Extract the service ID, removing the 'srv-' prefix if it exists to avoid duplication (srv-srv-)
        SERVICE_ID="${{ secrets.RENDER_SERVICE_ID }}"
        SERVICE_ID="${SERVICE_ID#srv-}"
        
        echo "Attempting to trigger deployment for srv-$SERVICE_ID..."
        
        # 1. Try the Render Deploy Hook first
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/deploy/srv-${SERVICE_ID}?key=${{ secrets.RENDER_API_KEY }}")
        
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "Deployment triggered successfully via Deploy Hook."
          exit 0
        fi
        
        echo "Deploy Hook failed with HTTP $HTTP_CODE. Checking if RENDER_API_KEY is a REST API token..."
        
        # 2. If it failed, try the Render REST API using the key as an Authorization token
        HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.render.com/v1/services/srv-${SERVICE_ID}/deploys" \
          -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
          -H "Content-Type: application/json" \
          -d '{"clearCache": "do_not_clear"}')
          
        if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
          echo "Deployment triggered successfully via REST API."
          exit 0
        fi
        
        echo "Deployment failed via REST API as well with HTTP $HTTP_CODE."
        echo "Please check that your GitHub secrets for RENDER_SERVICE_ID and RENDER_API_KEY are correct."
        exit 1
      # Note: Vercel might also be used for backend if configured, but Render is preferred for Socket.io
      
    - name: Deploy Frontend to Vercel
      uses: amondnet/vercel-action@v20
      with:
        vercel-token: ${{ secrets.VERCEL_TOKEN }}
        vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
        vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
        working-directory: ./frontend
        vercel-args: '--prod'
        github-token: ${{ secrets.GITHUB_TOKEN }}

